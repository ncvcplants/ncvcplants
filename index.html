<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5ee">
  <meta name="description" content="Browse the Seed & Soil plant collection.">
  <title>Seed & Soil — Plant collection</title>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar wrap">
    <a class="brand" href="index.html" aria-label="Seed and Soil home"><span class="brand-mark" aria-hidden="true">s.</span><span>seed & soil</span></a>
    <nav class="site-controls" aria-label="Site settings" data-i18n-aria="siteSettings">
      <button class="control-button" type="button" data-language-button aria-label="Switch language">العربية</button>
      <button class="control-button theme-button" type="button" data-theme-button aria-pressed="false">Dark mode</button>
    </nav>
  </header>
  <main>
    <section class="collection wrap" id="collection" aria-labelledby="collection-title">
      <div class="section-heading">
        <div><h1 id="collection-title" data-i18n="collectionTitle">Plant collection</h1></div>
        <p class="collection-count" id="collection-count" aria-live="polite"></p>
      </div>
      <div class="collection-tools">
        <label class="search-box"><span class="sr-only" data-i18n="searchLabel">Search plants</span><span class="search-icon" aria-hidden="true">⌕</span><input id="plant-search" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="Search plants" autocomplete="off"></label>
        <div class="filter-list" role="group" aria-label="Filter plants by type" data-i18n-aria="filterLabel">
          <button class="filter-chip is-active" type="button" data-filter="all" aria-pressed="true" data-i18n="allFilter">All</button>
          <button class="filter-chip" type="button" data-filter="flower" aria-pressed="false" data-i18n="flowerFilter">Flowers</button>
          <button class="filter-chip" type="button" data-filter="herb" aria-pressed="false" data-i18n="herbFilter">Herbs</button>
          <button class="filter-chip" type="button" data-filter="houseplant" aria-pressed="false" data-i18n="houseplantFilter">Houseplants</button>
        </div>
      </div>
      <div class="view-controls" role="group" aria-label="Plant collection view" data-i18n-aria="viewLabel">
        <button class="view-button is-active" type="button" data-view="cards" aria-pressed="true" data-i18n="cardsView">Cards</button>
        <button class="view-button" type="button" data-view="wheel" aria-pressed="false" data-i18n="wheelView">Plant wheel</button>
      </div>
      <div class="wheel-hub" aria-hidden="true" data-i18n="wheelHub">SEED LIBRARY</div>
      <div class="plant-grid" id="plant-grid" aria-live="polite"></div>
      <p class="empty-state" id="empty-state" hidden data-i18n="emptyState">No plants found. Try another search.</p>
    </section>
  </main>
  <footer class="footer wrap"><a class="brand brand-small" href="index.html"><span class="brand-mark" aria-hidden="true">s.</span><span>seed & soil</span></a><a class="back-top" href="#top" data-i18n="backToTop">Back to top ↑</a></footer>
</body>
</html>
